<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MCP Chat - Gestão MTB</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1a73e8; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 18px; }
        #status { font-size: 12px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
        .user { align-self: flex-end; background: #1a73e8; color: white; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .error { background: #fee; color: #c00; }
        .input-area { padding: 15px 20px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 24px; border: 1px solid #ddd; outline: none; font-size: 14px; }
        input[type="text"]:focus { border-color: #1a73e8; }
        button { padding: 12px 24px; border-radius: 24px; border: none; background: #1a73e8; color: white; cursor: pointer; font-size: 14px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .loading { align-self: flex-start; color: #888; font-style: italic; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <h1>🚴 Gestão MTB - MCP</h1>
        <span id="status">Desconectado</span>
    </header>

    <div id="chat"></div>

    <div class="input-area">
        <input type="text" id="msg" placeholder="Pergunte algo sobre atletas, resultados ou rankings..." disabled />
        <button onclick="sendMessage()" id="btnSend" disabled>Enviar</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const msgInput = document.getElementById('msg');
        const btnSend = document.getElementById('btnSend');


        window.addEventListener('load', connect);

        async function connect() {
            statusEl.textContent = 'Conectando...';
            try {
                const res = await fetch('/api/connect', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    statusEl.textContent = '✅ Conectado | Tools: ' + data.tools.join(', ');
                    msgInput.disabled = false;
                    btnSend.disabled = false;
                    msgInput.focus();
                } else {
                    statusEl.textContent = '❌ Erro: ' + data.error;
                }
            } catch (e) {
                statusEl.textContent = '❌ MCP Server offline';
            }
        }

        msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const message = msgInput.value.trim();
            if (!message) return;

            appendMsg(message, 'user');
            msgInput.value = '';
            msgInput.disabled = true;
            btnSend.disabled = true;

            const loadingEl = document.createElement('div');
            loadingEl.className = 'loading';
            loadingEl.textContent = 'Pensando...';
            document.getElementById('chat').appendChild(loadingEl);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                loadingEl.remove();

                if (data.error) {
                    appendMsg('Erro: ' + data.error, 'bot error');
                } else {
                    appendMsg(data.reply, 'bot');
                }
            } catch (err) {
                loadingEl.remove();
                appendMsg('Erro de conexão: ' + err.message, 'bot error');
            }

            msgInput.disabled = false;
            btnSend.disabled = false;
            msgInput.focus();
        }

        function appendMsg(text, cls) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
